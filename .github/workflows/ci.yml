name: StarTracker CI

on:
  push:
    branches: [ develop, master, 'feature/**' ]
  pull_request:
    branches: [ develop, master ]

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Linux GCC (Debug + Tests)"
            cc: gcc-13
            cxx: g++-13
          - name: "Linux Clang (Debug + Tests)"
            cc: clang-18
            cxx: clang++-18

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libopencv-dev \
            ${{ matrix.cc }} \
            ${{ matrix.cxx }}

      - name: Configure CMake (Test Preset)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake --preset test

      - name: Build Test Executables
        run: |
          cmake --build --preset test --parallel $(nproc)

      - name: Run Test Suites (CTest)
        run: |
          ctest --preset test --output-on-failure

      - name: Build Production Target (Dev Preset)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake --preset dev
          cmake --build --preset dev --parallel $(nproc)
